[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "flow_guard"
version = "0.1.0"
description = "Integrity checker and diff tool for guided-conversation-flow JSON"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["openai>=1.40"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
flow-guard = "flow_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["live: calls the real OpenAI API (skipped without OPENAI_API_KEY)"]
